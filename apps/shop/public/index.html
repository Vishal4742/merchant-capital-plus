<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bean There · demo shop</title>
  <style>
    :root { --ink: #0b1b3a; --blue: #1f4fff; --paper: #f6f7fb; --line: #dfe3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    main { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    small { color: #5b6785; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
    h1 { margin: 4px 0 20px; font-size: 24px; }
    .item { display: flex; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    p { color: #5b6785; font-size: 14px; margin: 16px 0 0; }
  </style>
</head>
<body>
  <main>
    <small>Demo shop</small>
    <h1>Bean There</h1>
    <div class="item"><span>Espresso</span><strong>2.00 USDT</strong></div>
    <form method="post" action="/api/checkout"><button type="submit">Buy espresso · 2.00 USDT</button></form>
    <p>Checkout by Merchant Capital+. No gas or crypto needed.</p>
  </main>
</body>
</html>
