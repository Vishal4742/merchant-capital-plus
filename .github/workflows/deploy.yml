name: deploy

# The only thing that deploys to Vercel. Vercel's own Git deploys are off
# (`git.deploymentEnabled: false` in each apps/*/vercel.json), because the Hobby plan
# allows 100 deployments a day and every push used to create 3.
#
# Every push to main deploys at once: one job per project, in parallel. Each job deploys
# only if the project's folder or packages/ changed since the last successful run, then
# checks that the project's production domains serve the new deployment.
# Runs never cancel each other: a push during a deploy waits for it, and every push in
# that time collapses into one follow-up run (a concurrency group keeps one pending run),
# so a burst of merges costs at most two deploys per project, and none is lost.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "arkiv/**", "notes/**", ".batches/**"]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy all configured projects, changed or not
        type: boolean
        default: false

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: deploy ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: [web, relayer, shop, mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Deploy if it changed, then check its domains
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_MCP_PROJECT_ID: ${{ vars.VERCEL_MCP_PROJECT_ID }}
          PROJECT: ${{ matrix.project }}
        run: bash tools/vercel-deploy.sh "$PROJECT"
