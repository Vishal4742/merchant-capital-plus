# CI for Merchant Capital+ (the same checks the pipeline's ci agent runs locally; AGENTS.md "Done means verified").
# Speed (human 2026-11-06 05:59): docs-only pushes skip CI, a newer push cancels the older run on the same
# branch, and each job runs only when its own folder (or this workflow) changed. The secret scan always runs.
name: ci
on:
  push:
    branches: [main, contracts, backend, relayer, sdk]
    paths-ignore: ["**/*.md", "docs/**", "arkiv/**", "notes/**", ".batches/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "arkiv/**", "notes/**", ".batches/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.f.outputs.contracts }}
      web: ${{ steps.f.outputs.web }}
      relayer: ${{ steps.f.outputs.relayer }}
      sdk: ${{ steps.f.outputs.sdk }}
      mcp: ${{ steps.f.outputs.mcp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="ALL"   # new branch or unknown base: run everything
          else
            files=$(git diff --name-only "$BASE" HEAD)
          fi
          hit() { [ "$files" = ALL ] || echo "$files" | grep -qE "$1"; }
          wf='^\.github/workflows/'
          hit "^contracts/|^packages/shared/|$wf" && echo contracts=true >> "$GITHUB_OUTPUT" || echo contracts=false >> "$GITHUB_OUTPUT"
          hit "^apps/web/|^packages/|$wf" && echo web=true >> "$GITHUB_OUTPUT" || echo web=false >> "$GITHUB_OUTPUT"
          hit "^apps/relayer/|^packages/shared/|$wf" && echo relayer=true >> "$GITHUB_OUTPUT" || echo relayer=false >> "$GITHUB_OUTPUT"
          hit "^packages/sdk/|$wf" && echo sdk=true >> "$GITHUB_OUTPUT" || echo sdk=false >> "$GITHUB_OUTPUT"
          hit "^packages/(mcp|sdk|shared)/|$wf" && echo mcp=true >> "$GITHUB_OUTPUT" || echo mcp=false >> "$GITHUB_OUTPUT"

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      # Fork tests run against Whitechain Sepolia through the public Ankr RPC in foundry.toml (no key).
      - run: forge build
        working-directory: contracts
      - run: forge test -vv -j 1   # one thread: the public Ankr RPC rate-limits parallel fork tests (HTTP 429)
        working-directory: contracts

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit   # Next 16 route types (LayoutProps) must exist before tsc
      - run: npm run lint
      - run: npm test
      - run: npm run build

  relayer:
    needs: changes
    if: needs.changes.outputs.relayer == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/relayer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/relayer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CON-7 / NFR-3: no private keys or provider tokens in tracked files (agentbus.py holds the detector patterns).
      - run: |
          if git grep -nE 'PRIVATE_KEY=0x[0-9a-fA-F]{64}|-----BEGIN [A-Z ]*PRIVATE KEY|(^|[^a-z])sk-[A-Za-z0-9_-]{20,}|sm_[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}' -- ':!tools/agentbus.py'; then
            echo "::error::possible secret in a tracked file"; exit 1
          fi
          git ls-files | grep -E '(^|/)\.env$' && { echo "::error::.env is tracked"; exit 1; } || true
