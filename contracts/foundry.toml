[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
# Chain 1874 runs prague; Foundry 1.8.6 defaults to osaka, whose opcodes revert there (research_notes/build_prep/contracts_prep.md §3).
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
whitechain = "https://rpc.ankr.com/whitechain_testnet"
