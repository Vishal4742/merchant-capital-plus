[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
# Chain 1874 runs prague; Foundry 1.8.6 defaults to osaka, whose opcodes revert there (research_notes/build_prep/contracts_prep.md §3).
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# MerchantPay's 10-argument paySale (ARCHITECTURE §2 ABI) is "stack too deep" under legacy codegen.
# Coverage under the IR pipeline: forge coverage --ir-minimum.
via_ir = true
# Explicit relative remappings only. Auto-detection pulls an absolute local path in from OZ's nested
# remappings.txt; it lands in the metadata hash, so other machines and Blockscout could only partially match.
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[lint]
# Deadlines and due dates here are minutes to days away; seconds of sequencer drift don't matter.
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
# Fork tests and scripts use the official Whitechain RPC: it serves historical state for the pinned fork block and
# answers rate limits with HTTP 429 + Retry-After, which Foundry retries. The public Ankr endpoint signalled its
# limit as a plain error, which surfaced as a bare EvmError: Revert in fork fuzz runs (batch 005 round 2).
whitechain = { endpoint = "https://rpc.testnet.whitechain.io", retries = 10, retry_backoff = 2000 }
